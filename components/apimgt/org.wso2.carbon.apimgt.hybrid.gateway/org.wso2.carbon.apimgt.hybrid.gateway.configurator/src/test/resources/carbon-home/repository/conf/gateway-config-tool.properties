apim.key_manager.service_url=url_key_manager
apim.key_manager.username=username
apim.key_manager.password=password
#APIManager.APIKeyValidator.KeyValidatorClientType=repository/conf/api-manager.xml::optional_key_validation_client_type
apim.analytics.enable=optional_analytics_enabled
apim.analytics.event_publisher_impl=usage_upload_data_publisher_class
apim.throttling.enable_header_based_throttling=advanced_throttling_header_conditions_enabled
apim.throttling.enable_jwt_claim_based_throttling=advanced_throttling_jwt_claim_conditions_enabled
apim.throttling.enable_query_param_based_throttling=advanced_throttling_query_param_conditions_enabled

