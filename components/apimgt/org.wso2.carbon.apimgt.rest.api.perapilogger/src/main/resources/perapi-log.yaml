swagger: '2.0'
info:
  title: WSO2 API Manager - Gateway
  version: v0.9
  description: This document specifies a **RESTful API** for WSO2 **API Manager** - Gateway
  contact:
    name: WSO2
    url: 'http://wso2.com/products/api-manager/'
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
basePath: /api/am/gateway/v0.9
consumes:
  - application/json
produces:
  - application/json
paths:
  /api-logging:
    post:
      parameters:
        - name: Payload
          description: Request Body
          required: false
          in: body
          schema:
            $ref: '#/definitions/APIList'
        - name: context
          in: query
          required: false
          type: string
        - name: logLevel
          in: query
          required: false
          type: string
          enum:
            - all
            - headers
            - body
      responses:
        '200':
          description: ''
        '404':
          description: |
            Not Found.
            Request resource not found.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal server error while configuring API to be logged
          schema:
            $ref: '#/definitions/Error'
    get:
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/APIList'
        '404':
          description: |
            Not Found.
            Request API context not found.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal server error while retrieving API data to be logged
          schema:
            $ref: '#/definitions/Error'
      parameters:
        - name: context
          in: query
          required: false
          type: string
    delete:
      responses:
        '204':
          description: ''
        '404':
          description: |
            Not Found.
            Requested API context not found.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal server error while deleting API details
          schema:
            $ref: '#/definitions/Error'
      parameters:
        - name: context
          in: query
          required: false
          type: string
definitions:
  APIList:
    title: apis
    properties:
      apis:
        type: array
        items:
          $ref: '#/definitions/API'
  API:
    title: API Info object with log details
    properties:
      context:
        type: string
        example: pizashack/v1.0.0
      logLevel:
        type: string
        example: all
  Error:
    title: Error object returned with 4XX HTTP Status
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int64
      message:
        type: string
        description: Error message.
      description:
        type: string
        description: |
          A detail description about the error message.
      moreInfo:
        type: string
        description: |
          Preferably an url with more details about the error.
      error:
        type: array
        description: |
          If there are more than one error list them out.
          For example, list out validation errors by each field.
        items:
          $ref: '#/definitions/ErrorListItem'
  ErrorListItem:
    title: Description of individual errors that may have occurred during a request.
    required:
      - code
      - message
    properties:
      code:
        type: string
      message:
        type: string
        description: |
          Description about individual errors occurred
      description:
        type: string
        description: |
          A detail description about the error message.
